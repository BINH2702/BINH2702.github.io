---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
    <h1>{{ page.title }}</h1>
    <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
